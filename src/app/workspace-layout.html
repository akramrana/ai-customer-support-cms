<mat-sidenav-container class="workspace">
  <mat-sidenav #sidebar id="workspace-sidebar" class="sidebar"
    [mode]="compact() ? 'over' : 'side'" [opened]="!compact()">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>Messenger Support<small>{{ workspace.label }}</small></span>
    </div>
    <mat-nav-list aria-label="Workspace navigation">
      <a mat-list-item routerLink="dashboard" routerLinkActive #dashboardLink="routerLinkActive"
        [activated]="dashboardLink.isActive" ariaCurrentWhenActive="page"
        (click)="compact() && sidebar.close()">Dashboard</a>
      @for (section of workspace.sections; track section.path) {
        <a mat-list-item [routerLink]="section.path" routerLinkActive #sectionLink="routerLinkActive"
          [activated]="sectionLink.isActive" ariaCurrentWhenActive="page"
          (click)="compact() && sidebar.close()">{{ section.label }}</a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="topbar">
      @if (compact()) {
        <button mat-button type="button" aria-controls="workspace-sidebar"
          [attr.aria-expanded]="sidebar.opened" (click)="sidebar.toggle()">Menu</button>
      }
      <span class="preview-label">Workspace preview</span>
      <a mat-button [routerLink]="['/', workspace.path, 'login']">Sign in</a>
    </mat-toolbar>
    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
